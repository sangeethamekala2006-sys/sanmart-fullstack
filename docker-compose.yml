
services:
  # MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: sanmart-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sanmart-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/sanmart
      CLIENT_URL: http://localhost:5173
      NODE_ENV: development
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sanmart-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
