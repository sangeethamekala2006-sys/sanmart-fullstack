
# SANMART Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: sangeetha2006/sanmart-backend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000

          envFrom:
          - configMapRef:
             name: sanmart-config
          - secretRef:
             name: sanmart-secrets
          env:
           - name: MONGODB_URI
             value: "mongodb://mongo:27017/sanmart"

          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

---
# SANMART Backend Service
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
